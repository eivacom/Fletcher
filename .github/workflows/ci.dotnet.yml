name: ci.dotnet

concurrency:
  group: ci.dotnet-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      devcontainer-image:
        description: >-
          Pre-built devcontainer image reference (e.g.
          eivaorg/fletcher-devcontainer:<sha>). The caller is
          responsible for invoking ci.setup-devcontainer-image.yml; this
          workflow only consumes the resulting image. ci.pr.yml passes the
          image it built once and shares across all callers; the
          cd.dotnet.yml wrapper does the same for tag-push releases. Only the
          Linux job needs it; the Windows job runs natively on the
          windows-2022 runner.
        required: true
        type: string

# The two-job split is the one ci.integration-test.protoc-gen-fletcher-rust.yml
# uses: Linux inside the devcontainer image (the same environment every other
# Fletcher Linux build runs in, and the one a developer gets from "Reopen in
# Container"), Windows natively with actions/setup-dotnet. Both legs restore with
# --locked-mode, so a dependency that changed without its packages.lock.json
# fails here rather than resolving differently on the two platforms.
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            dotnet
            .github

      - name: Pull devcontainer image
        uses: ./.github/actions/pull-devcontainer-image
        with:
          image: ${{ inputs.devcontainer-image }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      # The image carries the pinned .NET SDK (DOTNET_SDK_VERSION in
      # .devcontainer/Dockerfile) and dotnet/global.json pins the same band, so
      # there is no toolchain install step here at all — the Node pattern, not
      # the Rust one (D-BIND-21).
      - name: Restore, build, test, pack
        shell: bash
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace/dotnet \
            -e CI=true \
            fletcher-build \
            bash -c '
              set -e
              echo "::group::dotnet --info"
              dotnet --info
              echo "::endgroup::"
              dotnet restore Fletcher.slnx --locked-mode
              dotnet build Fletcher.slnx -c Release --no-restore
              dotnet test Fletcher.slnx -c Release --no-build --logger "trx;LogFileName=linux.trx"
              dotnet pack Fletcher.slnx -c Release --no-build -o /workspace/dotnet/artifacts
            '

      # The packages are the release artifact, and at BIND-0 they are also the
      # proof that packing works before there is anything in them. BIND-9 adds
      # the native assets, the LICENSE / THIRD-PARTY-LICENSES.txt staging that
      # #127 introduced for the gateway archive, and the asset-isolation check.
      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dotnet-packages
          path: |
            dotnet/artifacts/*.nupkg
            dotnet/artifacts/*.snupkg
          retention-days: 5

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dotnet-test-results-linux
          path: dotnet/**/TestResults/*.trx
          retention-days: 5

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            dotnet
            .github

      # global-json-file, not a literal version: dotnet/global.json is the single
      # pin, and the runner's own pre-installed SDKs must not be what decides
      # which one this job uses.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: dotnet/global.json

      - name: Restore, build, test
        shell: bash
        working-directory: dotnet
        env:
          CI: "true"
        run: |
          set -e
          dotnet --info
          dotnet restore Fletcher.slnx --locked-mode
          dotnet build Fletcher.slnx -c Release --no-restore
          dotnet test Fletcher.slnx -c Release --no-build --logger "trx;LogFileName=windows.trx"

      # No pack here: the packages are platform-neutral managed assemblies, and
      # packing them twice would produce two artifacts claiming to be the same
      # thing. Windows earns its place in this lane by RUNNING the tests — it is
      # the primary development platform, and the P/Invoke surface these packages
      # will carry is the part most likely to differ between the two.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dotnet-test-results-windows
          path: dotnet/**/TestResults/*.trx
          retention-days: 5
