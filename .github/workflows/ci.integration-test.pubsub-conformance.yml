name: ci.integration-test.pubsub-conformance

concurrency:
  group: ci.integration-test.pubsub-conformance-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      devcontainer-image:
        description: >-
          Pre-built devcontainer image reference (e.g.
          eivaorg/fletcher-devcontainer:<sha>). The caller is
          responsible for invoking ci.setup-devcontainer-image.yml; this
          workflow only consumes the resulting image. ci.pr.yml passes the
          image it built once and shares across all callers. Only the
          Linux job needs it; the Windows job runs natively on the
          windows-2022 runner.
        required: true
        type: string

# The pub/sub delivery contract (docs/pubsub-interface-spec.md §7) run against
# all three providers, two of them with the publisher in a CHILD PROCESS.
# The cross-process subjects are the point: Fast DDS serves same-process
# endpoints over intra-process delivery, so a single-process suite cannot see the
# transport at all — the provider's own suite stayed green through a shipped
# receive-side data-sharing defect for exactly that reason (§7.2).
#
# KNOWN BLIND SPOT: this lane does NOT guard against that particular defect. It
# stayed green against a provider with the defect deliberately restored, while
# ci.integration-test.gateway-fastdds-ts fails against the same build. Evidence
# and both refuted hypotheses: integration-tests/pubsub-conformance/README.md.
# The hunt is owned by PDA-ABI-7. So a green run here means the delivery contract
# holds; it does not mean receive-side data-sharing is safe.
#
# Deliberately does not check out arrow-bridge / pubsub-arrow: the harness
# requires no Arrow C++ and no codec.

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            core
            pubsub
            fastdds-pubsub-provider
            xrcedds-pubsub-provider
            integration-tests/pubsub-conformance
            .conan-profiles
            .github

      - name: Pull devcontainer image
        uses: ./.github/actions/pull-devcontainer-image
        with:
          image: ${{ inputs.devcontainer-image }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      # Restore the MicroXRCEAgent superbuild on Linux too. The harness's
      # CMakeLists defaults the install dir into CMAKE_BINARY_DIR, which nothing
      # persists, so without this the ~10-15 min superbuild ran on EVERY run of
      # this lane. `conan build .` takes no -D, so the path comes in through
      # FLETCHER_AGENT_INSTALL_DIR (see the harness CMakeLists) and has to live
      # under the workspace: that is the only path mounted into the container.
      #
      # Restore/save are split so a partial install from a failed or cancelled
      # run is never cached under the exact key — the CMake skip-guard would
      # otherwise trust it. No prefix fallback, for the same reason.
      - name: Restore MicroXRCEAgent build
        id: agent-cache-linux
        uses: actions/cache/restore@v5.0.5
        with:
          path: ${{ github.workspace }}/.uxa-install
          key: microxrce-agent-conf-linux-${{ hashFiles('integration-tests/pubsub-conformance/CMakeLists.txt', '.conan-profiles/Linux-gcc13-x86_64-Release') }}

      - name: Build components and run the conformance suite
        run: |
          docker run --rm --network host -v ${{ github.workspace }}:/workspace -w /workspace \
            -e FLETCHER_AGENT_INSTALL_DIR=/workspace/.uxa-install \
            fletcher-build \
            bash -c "set -e && \
                     PROFILE=/workspace/.conan-profiles/Linux-gcc13-x86_64-Release && \
                     for COMPONENT in core pubsub fastdds-pubsub-provider xrcedds-pubsub-provider; do \
                       echo '::group::conan create '\$COMPONENT && \
                       (cd \$COMPONENT && conan create . --build=missing -pr:a=\$PROFILE) && \
                       echo '::endgroup::'; \
                     done && \
                     cd integration-tests/pubsub-conformance && \
                     echo '::group::conan build conformance suite (configure + build incl. MicroXRCEAgent + ctest)' && \
                     conan build . --build=missing -pr:a=\$PROFILE && \
                     echo '::endgroup::'"

      - name: Save MicroXRCEAgent build
        if: success() && steps.agent-cache-linux.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5.0.5
        with:
          path: ${{ github.workspace }}/.uxa-install
          key: microxrce-agent-conf-linux-${{ hashFiles('integration-tests/pubsub-conformance/CMakeLists.txt', '.conan-profiles/Linux-gcc13-x86_64-Release') }}

  windows:
    runs-on: windows-2022
    env:
      # Short Conan home so deep dependency build paths (notably boost's
      # source tree) stay under Windows' 260-char MAX_PATH, and so the
      # Cache Conan path below is deterministic regardless of runner user.
      CONAN_HOME: C:\cn2
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            core
            pubsub
            fastdds-pubsub-provider
            xrcedds-pubsub-provider
            integration-tests/pubsub-conformance
            .conan-profiles
            .github

      - name: Install Conan
        uses: ./.github/actions/conan-install

      # Cache the third-party Conan binaries. fast-dds has no prebuilt
      # binary on conancenter, so `--build=missing` compiles it from
      # source. The fletcher-* packages are re-created every run
      # regardless, so a warm-but-stale restore via the prefix key is
      # harmless; the exact key only governs when a fresh cache is
      # written. Trimmed before save (see last step).
      - name: Cache Conan home
        uses: actions/cache@v5.0.5
        with:
          path: C:\cn2
          key: conan-win-pubsub-conformance-${{ hashFiles('.conan-profiles/Windows-msvc194-x86_64-Release', 'fastdds-pubsub-provider/conanfile.py', 'xrcedds-pubsub-provider/conanfile.py') }}
          restore-keys: |
            conan-win-pubsub-conformance-
            conan-win-

      # Restore the MicroXRCEAgent superbuild. The install dir
      # (C:\fl-uxa-install) is SHARED with
      # integration-tests/fastdds-xrce-interop by design, so the ~10-15 min
      # superbuild happens once per machine; the ExternalProject *prefix*
      # is this harness's own, because a shared source+build tree collides
      # when two harnesses configure concurrently. Keyed on this harness's
      # CMakeLists (which pins the Agent's GIT_TAG) + the profile, so a tag
      # bump invalidates it. No prefix fallback: a stale restore would make
      # the CMake guard skip rebuilding the wrong version.
      #
      # Restore/save are split (not a plain actions/cache) so the install is
      # saved only on a green run — a plain cache's post-step would persist
      # a partial install from a cancelled/failed run, which the CMake
      # skip-guard would then trust.
      - name: Restore MicroXRCEAgent build
        id: agent-cache
        uses: actions/cache/restore@v5.0.5
        with:
          path: C:\fl-uxa-install
          key: microxrce-agent-conf-win-${{ hashFiles('integration-tests/pubsub-conformance/CMakeLists.txt', '.conan-profiles/Windows-msvc194-x86_64-Release') }}

      - name: Build components into local Conan cache
        shell: bash
        run: |
          set -e
          PROFILE=.conan-profiles/Windows-msvc194-x86_64-Release
          for COMPONENT in core pubsub fastdds-pubsub-provider xrcedds-pubsub-provider; do
            echo "::group::conan create $COMPONENT"
            (cd "$COMPONENT" && conan create . --build=missing -pr:a="../$PROFILE")
            echo "::endgroup::"
          done

      - name: conan build conformance suite (configure + build incl. MicroXRCEAgent + ctest)
        shell: bash
        working-directory: integration-tests/pubsub-conformance
        run: conan build . --build=missing -pr:a=../../.conan-profiles/Windows-msvc194-x86_64-Release

      # Save the freshly-built Agent install, but only on a green run and
      # only when the restore missed — so a partial install from a failed
      # or cancelled run is never cached under the exact key.
      - name: Save MicroXRCEAgent build
        if: success() && steps.agent-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5.0.5
        with:
          path: C:\fl-uxa-install
          key: microxrce-agent-conf-win-${{ hashFiles('integration-tests/pubsub-conformance/CMakeLists.txt', '.conan-profiles/Windows-msvc194-x86_64-Release') }}

      # Strip Conan sources + build folders (keeps the package binaries)
      # before the actions/cache post-step so the saved home stays small.
      - name: Trim Conan cache before save
        if: always()
        shell: bash
        run: conan cache clean "*" || true
