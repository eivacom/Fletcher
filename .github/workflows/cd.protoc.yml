#
# Release orchestration for fletcher-protoc. Pipeline order matches
# cd.gateway-client.yml so both @eiva npm packages release the same way:
#
#   setup-devcontainer
#       │
#       └── release (ci.protoc.yml)
#               │  produces 6 artifacts:
#               │    fletcher-protoc-{linux,windows}            (Conan .tgz)
#               │    fletcher-protoc-{linux,windows}-static     (raw binary)
#               │    fletcher-protoc-licences                   (LICENSE, COPYING,
#               │                                                THIRD-PARTY-LICENSES.txt)
#               │    fletcher-protoc-nuget                      (Eiva.Fletcher.Protoc)
#               ▼
#         npm-publish                            ── @eiva/protoc-gen-fletcher,
#               │                                   with the licence files
#               ▼
#         create-release                         ── GitHub Release with
#                                                   npm link prepended to
#                                                   auto-generated notes;
#                                                   the licence files beside
#                                                   the binaries (BIND-9b-7,
#                                                   review T13, M6)
#
# All build jobs (shared + static) live in ci.protoc.yml as the single
# source of truth. On tag-push it produces both the Conan tarballs and
# the raw static binaries; on PR runs the static jobs are gated off
# (the integration-test workflows already exercise the static build
# via their own `conan create`).
#
# Publishing to npm BEFORE creating the GitHub Release lets the release
# body link to the just-published version on npmjs.com (same pattern as
# cd.gateway-client.yml). Conan consumers get the .tgz tarballs as
# release assets; npm/raw-binary consumers get the statically-linked
# single-file binaries.
#
# Triggers:
#   * push: tags 'protoc-v*'     — real release.
#   * workflow_dispatch          — a DRY RUN (BIND-9b-6, D-BIND-164): the build, the static binaries
#                                  and Eiva.Fletcher.Protoc packed and checked; never npm, the
#                                  Release or nuget.org. Dispatchable once this file is on main.
#
# BIND-9b-6 (D-BIND-71, D-BIND-176): the Release also carries Eiva.Fletcher.Protoc, the C# locator
# ci.protoc packs, and the nuget-org job then pushes it to nuget.org by Trusted Publishing.

name: cd.protoc

on:
  push:
    tags:
      - 'protoc-v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

jobs:
  setup-devcontainer:
    uses: ./.github/workflows/ci.setup-devcontainer-image.yml
    secrets: inherit

  release:
    needs: setup-devcontainer
    uses: ./.github/workflows/ci.protoc.yml
    with:
      devcontainer-image: ${{ needs.setup-devcontainer.outputs.image }}
      release-artifacts: true
    secrets: inherit

  npm-publish:
    needs: release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # D-BIND-176: deployable from the release tags only, as the nuget-org environment is.
    environment: npm
    # id-token: write is required for `npm publish --provenance` to mint
    # an OIDC token that npm exchanges for a signed Sigstore attestation
    # linking the package back to this exact workflow run. Matches the
    # cd.gateway-client.yml pattern so both @eiva npm packages ship with
    # provenance.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            protoc/npm
            .github

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24.15.0
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag version matches protoc/npm/package.json version
        uses: ./.github/actions/verify-tag-version-npm
        with:
          package-json: protoc/npm/package.json
          tag-prefix: protoc-v

      # BIND-9b-7 (review T13, M6): the package ships LICENSE, COPYING and the plugin's
      # THIRD-PARTY-LICENSES.txt, the files ci.protoc's Linux leg wrote and checked, so a
      # consumer who never opens the Release still receives the notices of what the native
      # plugin it downloads links statically. package.json's "files" lists them; the publish
      # is refused if the tarball would not carry all three.
      - name: Stage the licence files into the package
        uses: actions/download-artifact@v8.0.1
        with:
          name: fletcher-protoc-licences
          path: protoc/npm

      - name: Require the licence files in the tarball
        working-directory: protoc/npm
        run: |
          set -euo pipefail
          for f in LICENSE COPYING THIRD-PARTY-LICENSES.txt; do
            test -s "$f" || { echo "::error::protoc/npm/$f is missing or empty"; exit 1; }
            npm pack --dry-run --json | grep -q "\"path\": *\"$f\"" || { echo "::error::npm pack would not carry $f"; exit 1; }
          done

      - name: Resolve dist-tag
        id: dist-tag
        working-directory: protoc/npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            PRE=$(echo "$VERSION" | sed 's/^[0-9]*\.[0-9]*\.[0-9]*-//' | cut -d. -f1)
            echo "tag=$PRE" >> "$GITHUB_OUTPUT"
          fi

      # Trusted Publishing: npm exchanges the id-token (OIDC) minted by
      # GitHub Actions for a short-lived publish credential, gated on the
      # repo + workflow filename configured on npmjs.com under
      # @eiva/protoc-gen-fletcher → Settings → Trusted Publishers. No
      # NODE_AUTH_TOKEN needed. Matches cd.gateway-client.yml.
      - name: Publish to npm
        working-directory: protoc/npm
        run: npm publish --access public --provenance --tag ${{ steps.dist-tag.outputs.tag }}

  create-release:
    # `release` is also a transitive dep (via npm-publish), but it's
    # named explicitly here so the verify-tag-version-conan step below
    # can reference ${{ needs.release.outputs.conan-ref }}.
    needs: [release, npm-publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            protoc
            .github

      - name: Verify tag version matches conanfile.py version
        uses: ./.github/actions/verify-tag-version-conan
        with:
          conan-ref: ${{ needs.release.outputs.conan-ref }}
          tag-prefix: protoc-v

      # Download the upstream artifacts at once:
      #   - fletcher-protoc-linux + fletcher-protoc-windows
      #       → shared-linked Conan-package tarballs (from ci.protoc.yml)
      #   - fletcher-protoc-linux-static + fletcher-protoc-windows-static
      #       → static-linked raw binaries (from build-static-* jobs)
      #   - fletcher-protoc-licences → LICENSE, COPYING, THIRD-PARTY-LICENSES.txt
      #       (BIND-9b-7, review T13, M6: attached beside the binaries)
      #   - fletcher-protoc-nuget → Eiva.Fletcher.Protoc
      # `merge-multiple: true` flattens each artifact's files into the
      # current directory, matching the file names the gh release create
      # command below expects. (protoc-notice-windows, the Windows leg's
      # notice, is named outside this pattern: it exists to be compared
      # in ci.protoc's pack-nuget, not to be shipped.)
      - name: Download all release artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: fletcher-protoc-*
          merge-multiple: true

      - name: Verify all release assets are present
        shell: bash
        run: |
          set -euo pipefail
          for asset in \
            fletcher-protoc-linux-conan-package.tgz \
            fletcher-protoc-windows-conan-package.tgz \
            protoc-gen-fletcher-linux-x64 \
            protoc-gen-fletcher-windows-x64.exe \
            "Eiva.Fletcher.Protoc.${GITHUB_REF_NAME#protoc-v}.nupkg" \
            LICENSE COPYING THIRD-PARTY-LICENSES.txt; do
            if [ ! -f "$asset" ]; then
              echo "::error::Missing release asset: $asset"
              ls -lah
              exit 1
            fi
          done
          chmod +x protoc-gen-fletcher-linux-x64
          ls -lah fletcher-protoc-*-conan-package.tgz protoc-gen-fletcher-*

      # Compose release notes: prepend a link to the just-published npm
      # version, then append GitHub's auto-generated PR/commit list.
      # Matches cd.gateway-client.yml's create-release pattern.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#protoc-v}"
          GENERATED=$(gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${{ github.ref_name }}" \
            -q '.body')
          NOTES=$(printf "## npm\n\nhttps://www.npmjs.com/package/@eiva/protoc-gen-fletcher/v/%s\n\n%s" "${VERSION}" "${GENERATED}")
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "${{ github.ref_name }}" \
            --notes "${NOTES}" \
            "fletcher-protoc-windows-conan-package.tgz" \
            "fletcher-protoc-linux-conan-package.tgz" \
            "protoc-gen-fletcher-linux-x64" \
            "protoc-gen-fletcher-windows-x64.exe" \
            "Eiva.Fletcher.Protoc.${VERSION}.nupkg" \
            "LICENSE" \
            "COPYING" \
            "THIRD-PARTY-LICENSES.txt"

  # D-BIND-176: Eiva.Fletcher.Protoc to nuget.org, by Trusted Publishing, as cd.dotnet's nuget-org
  # job does (a policy of its own names this file). nuget.org never deletes a version, so the
  # first push of one is final; --skip-duplicate makes a re-run safe.
  nuget-org:
    needs: create-release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: nuget-org
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@v8.0.1
        with:
          name: fletcher-protoc-nuget
          path: packages

      - name: Check that the nuget.org user is set
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::the nuget-org environment has no NUGET_USER variable: set it to the nuget.org profile name of the member who created the Trusted Publishing policy (D-BIND-176)"
            exit 1
          fi

      - name: NuGet login (OIDC token for a one-hour API key)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push the package
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push "packages/Eiva.Fletcher.Protoc.${GITHUB_REF_NAME#protoc-v}.nupkg" \
            --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate
