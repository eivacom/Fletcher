name: cd.nuget-feed

# BIND-9b-6 (D-BIND-28, D-BIND-153, D-BIND-163): pushes the .nupkg and .snupkg files attached to
# one GitHub Release to EIVA's internal feed, nuget.eiva.com. The feed's address is private
# (10.x), so the push runs on the self-hosted runner inside the EIVA network, labelled
# [self-hosted, eiva-network]: the only job that runner runs, never pull-request code (both ways
# in are a tag's release run or a person's dispatch). It needs bash, the .NET SDK and gh, and
# the NUGET_EIVA_API_KEY secret (a BaGetter API key).
#
# The release never waits on the runner (D-BIND-153): cd.dotnet.yml and cd.protoc.yml call this
# only when the repository variable NUGET_EIVA_RUNNER is 'true', which an admin sets once the
# runner exists. A release cut before then is pushed by dispatching this workflow with its tag.
# It pushes exactly the Release's assets, the packages the release gate tested.

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag whose packages to push, e.g. dotnet-v0.6.0-alpha.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag whose packages to push, e.g. dotnet-v0.6.0-alpha or protoc-v0.6.0-alpha.
        required: true
        type: string

jobs:
  # On a GitHub-hosted runner, so a dispatch before the runner exists fails here, with a reason,
  # instead of waiting a day for a runner that is not there.
  runner-enabled:
    runs-on: ubuntu-latest
    steps:
      - name: Check that the feed runner is enabled
        env:
          ENABLED: ${{ vars.NUGET_EIVA_RUNNER }}
        run: |
          if [ "$ENABLED" != true ]; then
            echo "::error::the nuget.eiva.com runner is not enabled: set the repository variable NUGET_EIVA_RUNNER to 'true' once the self-hosted runner [self-hosted, eiva-network] exists"
            exit 1
          fi

  push:
    needs: runner-enabled
    runs-on: [self-hosted, eiva-network]
    permissions:
      contents: read
    steps:
      - name: Download the Release's packages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          rm -rf packages
          gh release download "$TAG" --repo "${{ github.repository }}" --pattern '*.nupkg' --pattern '*.snupkg' --dir packages
          ls -l packages
          ls packages/*.nupkg > /dev/null 2>&1 || { echo "::error::release $TAG has no .nupkg assets"; exit 1; }

      # The feed's service index routes symbol packages to its symbol endpoint
      # (SymbolPackagePublish/4.9.0, D-BIND-28). --skip-duplicate: a re-run, or a dispatch for a
      # release already pushed, changes nothing.
      - name: Push the packages
        shell: bash
        env:
          NUGET_EIVA_API_KEY: ${{ secrets.NUGET_EIVA_API_KEY }}
        run: |
          set -euo pipefail
          [ -n "$NUGET_EIVA_API_KEY" ] || { echo "::error::the NUGET_EIVA_API_KEY secret is not set"; exit 1; }
          dotnet nuget push 'packages/*.nupkg' --source https://nuget.eiva.com/v3/index.json \
            --api-key "$NUGET_EIVA_API_KEY" --skip-duplicate --no-symbols
          if ls packages/*.snupkg > /dev/null 2>&1; then
            dotnet nuget push 'packages/*.snupkg' --source https://nuget.eiva.com/v3/index.json \
              --api-key "$NUGET_EIVA_API_KEY" --skip-duplicate
          fi
