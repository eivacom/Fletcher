name: ci.integration-test.pubsub-transport-conformance

concurrency:
  group: ci.integration-test.pubsub-transport-conformance-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      devcontainer-image:
        description: >-
          Pre-built devcontainer image reference. The caller invokes
          ci.setup-devcontainer-image.yml; this workflow only consumes the
          resulting image. Only the Linux job needs it; the Windows job runs
          natively on the windows-2022 runner.
        required: true
        type: string

# BIND-4d-iii. One body of C#, every transport, selected by name - the managed
# half of BIND-4's "Fast DDS and XRCE reachable by selector with NO PER-TRANSPORT
# C# CODE".
#
# WHY THIS IS NOT PART OF THE `dotnet` LANE. These rows create REAL Fast DDS
# participants: discovery traffic, shared memory and multicast on the runner. The
# unit lane is deterministic and transport-free and is worth keeping that way -
# and this repo has already lost a review cycle to a false `0xC0000005` from
# leaked segments in `C:\ProgramData\eprosima\fastdds_interprocess` being read as
# a code defect. Here that failure is diagnosable; there it would look like a
# regression in the binding.
#
# THE CHECKOUT HAS NO C++ OF ITS OWN TO BUILD, unlike binding-abi-conformance:
# this lane's suite is pure C# and its only native dependency is the shim, which
# `conan create c-abi` produces. The component list is still the full chain
# because the shim statically links the providers it must be able to select - a
# shim built without `fastdds-pubsub-provider` would fail these rows at
# `ProviderRegistry.Create`, which is the right failure but an expensive way to
# discover a missing checkout entry.
#
# A NEW CONSUMER OF A PATH OUTSIDE THIS LIST ADDS IT HERE AND TO ci.pr.yml's
# FILTER, IN THE SAME COMMIT. BIND-3c went red for exactly that: a lane gained a
# file dependency, only the checkout was updated, and the suite silently found no
# cases.
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            core
            pubsub
            arrow-bridge
            fastdds-pubsub-provider
            xrcedds-pubsub-provider
            c-abi
            dotnet
            integration-tests/pubsub-transport-conformance
            .conan-profiles
            .github

      - name: Pull devcontainer image
        uses: ./.github/actions/pull-devcontainer-image
        with:
          image: ${{ inputs.devcontainer-image }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build the chain, then run one body over every transport
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace \
            fletcher-build \
            bash -c "set -e && \
                     PROFILE=/workspace/.conan-profiles/Linux-gcc13-x86_64-Release && \
                     for COMPONENT in core pubsub arrow-bridge fastdds-pubsub-provider xrcedds-pubsub-provider c-abi; do \
                       echo '::group::conan create '\$COMPONENT && \
                       (cd \$COMPONENT && conan create . --build=missing -pr:a=\$PROFILE) && \
                       echo '::endgroup::'; \
                     done && \
                     SHIM=\$(find ~/.conan2/p -path '*/p/lib/libfletcher-c-abi.so' -type f -print -quit) && \
                     if [ -z \"\$SHIM\" ]; then echo '::error::libfletcher-c-abi.so not found after conan create'; exit 1; fi && \
                     echo '::group::dotnet test' && \
                     cd integration-tests/pubsub-transport-conformance/dotnet/PubSubTransportConformance && \
                     dotnet test -c Release -p:FletcherNativeShim=\$SHIM && \
                     echo '::endgroup::'"

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            core
            pubsub
            arrow-bridge
            fastdds-pubsub-provider
            xrcedds-pubsub-provider
            c-abi
            dotnet
            integration-tests/pubsub-transport-conformance
            .conan-profiles
            .github

      - name: Install Conan
        uses: ./.github/actions/conan-install

      # global-json-file, not a literal version: dotnet/global.json is the single
      # pin, and the runner's own pre-installed SDKs must not decide this.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: dotnet/global.json

      - name: Build components into the local Conan cache
        shell: bash
        run: |
          set -e
          PROFILE=.conan-profiles/Windows-msvc194-x86_64-Release
          for COMPONENT in core pubsub arrow-bridge fastdds-pubsub-provider xrcedds-pubsub-provider c-abi; do
            echo "::group::conan create $COMPONENT"
            (cd "$COMPONENT" && conan create . --build=missing -pr:a="../$PROFILE")
            echo "::endgroup::"
          done

      # Checked, not trusted: the suite FAILS rather than skips without the shim,
      # so an empty find must stop the job here with a diagnostic rather than
      # produce a green run over nothing.
      - name: Locate the shim
        id: shim
        shell: bash
        run: |
          set -e
          SHIM=$(find ~/.conan2/p -path '*/p/bin/fletcher-c-abi.dll' -type f -print -quit)
          if [ -z "$SHIM" ]; then
            echo "::error::fletcher-c-abi.dll not found in the Conan cache after conan create"
            exit 1
          fi
          echo "path=$SHIM" >> "$GITHUB_OUTPUT"

      # Cleared BEFORE the suite runs, not after a failure. Leaked segments from
      # an earlier job on a reused runner fault `create_participant` with a false
      # `0xC0000005` for any QoS, which is indistinguishable from a real crash in
      # the binding - the repo's standing rule is to clear this directory before
      # believing any provider access violation, so this lane does it up front
      # rather than leaving the next reader to discover the rule.
      - name: Clear leaked Fast DDS shared-memory segments
        shell: bash
        run: rm -rf "/c/ProgramData/eprosima/fastdds_interprocess" || true

      - name: Run one body over every transport
        shell: bash
        working-directory: integration-tests/pubsub-transport-conformance/dotnet/PubSubTransportConformance
        run: dotnet test -c Release -p:FletcherNativeShim="${{ steps.shim.outputs.path }}"
