name: ci.integration-test.pubsub-transport-conformance

concurrency:
  group: ci.integration-test.pubsub-transport-conformance-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      devcontainer-image:
        description: >-
          Pre-built devcontainer image reference. The caller invokes
          ci.setup-devcontainer-image.yml; this workflow only consumes the
          resulting image. Only the Linux job needs it; the Windows job runs
          natively on the windows-2022 runner.
        required: true
        type: string

# BIND-4d-iii. One body of C#, every transport, selected by name - the managed
# half of BIND-4's "Fast DDS and XRCE reachable by selector with NO PER-TRANSPORT
# C# CODE".
#
# WHY THIS IS NOT PART OF THE `dotnet` LANE. These rows create REAL Fast DDS
# participants: discovery traffic, shared memory and multicast on the runner. The
# unit lane is deterministic and transport-free and is worth keeping that way -
# and this repo has already lost a review cycle to a false `0xC0000005` from
# leaked segments in `C:\ProgramData\eprosima\fastdds_interprocess` being read as
# a code defect. Here that failure is diagnosable; there it would look like a
# regression in the binding.
#
# THE CHECKOUT HAS NO C++ OF ITS OWN TO BUILD, unlike binding-abi-conformance:
# this lane's suite is pure C# and its only native dependency is the shim, which
# `conan create c-abi` produces. The component list is still the full chain
# because the shim statically links the providers it must be able to select - a
# shim built without `fastdds-pubsub-provider` would fail these rows at
# `ProviderRegistry.Create`, which is the right failure but an expensive way to
# discover a missing checkout entry.
#
# THE `xrce` ROWS NEED A MicroXRCEAgent (D-BIND-56). The lane builds eProsima's
# Agent from the recipe the C++ interop lane uses,
# integration-tests/cmake/MicroXrceAgent.cmake, through the Agent-only project in
# integration-tests/pubsub-transport-conformance/agent, and hands its path to the
# suite as MICRO_XRCE_AGENT_PATH. The suite's fixture starts it and PROVES it owns
# the port before any row runs. On Windows the install is cached under the SAME
# key as the interop lane's; on Linux it is built every run, as the interop lane
# builds it (~10-15 min cold).
#
# THE SERVER PASS (D10C-7, audit 0a M2). A SubscriberArrow's batched form is domain 7's
# from D10C-7, so ASubscriberArrowForwardsItsReaderProfileOnBothForms proves its batched
# half only against the SERVER build. The same suite runs a second time with the server
# shim staged UNDER ITS OWN NAME (the C# loader prefers it, ruling 2026-11-15) into a
# fresh output folder that must hold it (`test -f`), as binding-abi-conformance's server
# pass does; on the edge pass the batched half is the edge refusal. Each shim is found by
# its package's identity (scripts/locate_shim.sh): the cache holds both builds.
#
# A NEW CONSUMER OF A PATH OUTSIDE THIS LIST ADDS IT HERE AND TO ci.pr.yml's
# FILTER, IN THE SAME COMMIT. BIND-3c went red for exactly that: a lane gained a
# file dependency, only the checkout was updated, and the suite silently found no
# cases.
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            core
            pubsub
            arrow-bridge
            pubsub-arrow
            fastdds-pubsub-provider
            xrcedds-pubsub-provider
            c-abi
            dotnet
            integration-tests/pubsub-transport-conformance
            integration-tests/cmake
            scripts
            .conan-profiles
            .github

      - name: Pull devcontainer image
        uses: ./.github/actions/pull-devcontainer-image
        with:
          image: ${{ inputs.devcontainer-image }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build the chain, then run one body over every transport
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace \
            fletcher-build \
            bash -c "set -e && \
                     PROFILE=/workspace/.conan-profiles/Linux-gcc13-x86_64-Release && \
                     for COMPONENT in core pubsub arrow-bridge pubsub-arrow fastdds-pubsub-provider xrcedds-pubsub-provider c-abi; do \
                       echo '::group::conan create '\$COMPONENT && \
                       (cd \$COMPONENT && conan create . --build=missing -pr:a=\$PROFILE) && \
                       echo '::endgroup::'; \
                     done && \
                     echo '::group::conan create c-abi (server build)' && \
                     (cd c-abi && conan create . --build=missing -pr:a=\$PROFILE -o '&:variant=server') && \
                     echo '::endgroup::' && \
                     SHIM=\$(bash scripts/locate_shim.sh fletcher-c-abi variant=edge) && \
                     SERVER=\$(bash scripts/locate_shim.sh fletcher-c-abi-server variant=server) && \
                     echo '::group::conan build the MicroXRCEAgent' && \
                     (cd integration-tests/pubsub-transport-conformance/agent && conan build . --build=missing -pr:a=\$PROFILE) && \
                     echo '::endgroup::' && \
                     export MICRO_XRCE_AGENT_PATH=/workspace/integration-tests/pubsub-transport-conformance/agent/install/bin/MicroXRCEAgent && \
                     export MICRO_XRCE_AGENT_LIB_DIR=/workspace/integration-tests/pubsub-transport-conformance/agent/install/lib && \
                     if [ ! -x \"\$MICRO_XRCE_AGENT_PATH\" ]; then echo '::error::MicroXRCEAgent not found after conan build'; exit 1; fi && \
                     echo '::group::dotnet test (edge build)' && \
                     cd integration-tests/pubsub-transport-conformance/dotnet/PubSubTransportConformance && \
                     dotnet test -c Release -p:FletcherNativeShim=\$SHIM && \
                     echo '::endgroup::' && \
                     echo '::group::dotnet test (server build, under its own name)' && \
                     OUT=\$(mktemp -d) && \
                     dotnet test -c Release -o \"\$OUT\" -p:FletcherNativeShim=\"\$SERVER\" && \
                     if [ ! -f \"\$OUT/libfletcher-c-abi-server.so\" ]; then echo '::error::the server pass output folder holds no server shim; the server pass did not test the server build'; exit 1; fi && \
                     echo '::endgroup::'"

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            core
            pubsub
            arrow-bridge
            pubsub-arrow
            fastdds-pubsub-provider
            xrcedds-pubsub-provider
            c-abi
            dotnet
            integration-tests/pubsub-transport-conformance
            integration-tests/cmake
            scripts
            .conan-profiles
            .github

      - name: Install Conan
        uses: ./.github/actions/conan-install

      # global-json-file, not a literal version: dotnet/global.json is the single
      # pin, and the runner's own pre-installed SDKs must not decide this.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: dotnet/global.json

      # One cached Agent for this lane and the interop lane: the same path, the
      # same key. No prefix fallback - a stale restore would make the recipe's
      # skip-guard trust the wrong Agent version.
      - name: Restore MicroXRCEAgent build
        id: agent-cache
        uses: actions/cache/restore@v5.0.5
        with:
          path: C:\fl-uxa-install
          key: microxrce-agent-win-${{ hashFiles('integration-tests/cmake/MicroXrceAgent.cmake', '.conan-profiles/Windows-msvc194-x86_64-Release') }}

      - name: Build components into the local Conan cache
        shell: bash
        run: |
          set -e
          PROFILE=.conan-profiles/Windows-msvc194-x86_64-Release
          for COMPONENT in core pubsub arrow-bridge pubsub-arrow fastdds-pubsub-provider xrcedds-pubsub-provider c-abi; do
            echo "::group::conan create $COMPONENT"
            (cd "$COMPONENT" && conan create . --build=missing -pr:a="../$PROFILE")
            echo "::endgroup::"
          done
          # The server build too, for the server pass (D10C-7, M2).
          echo "::group::conan create c-abi (server build)"
          (cd c-abi && conan create . --build=missing -pr:a="../$PROFILE" -o "&:variant=server")
          echo "::endgroup::"

      - name: Build the MicroXRCEAgent
        shell: bash
        working-directory: integration-tests/pubsub-transport-conformance/agent
        run: conan build . --build=missing -pr:a=../../../.conan-profiles/Windows-msvc194-x86_64-Release

      # Straight after the build, so a complete install is saved even if a row
      # later fails - and never a partial one, which `success()` rules out.
      - name: Save MicroXRCEAgent build
        if: success() && steps.agent-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5.0.5
        with:
          path: C:\fl-uxa-install
          key: microxrce-agent-win-${{ hashFiles('integration-tests/cmake/MicroXrceAgent.cmake', '.conan-profiles/Windows-msvc194-x86_64-Release') }}

      # Checked, not trusted: the suite FAILS rather than skips without the shim,
      # so a lookup that finds none or several must stop the job here with a
      # diagnostic rather than produce a green run over nothing. Each shim is found
      # by its package's identity (locate_shim.sh): the cache holds both builds.
      - name: Locate the shims
        id: shim
        shell: bash
        run: |
          set -e
          SHIM=$(bash scripts/locate_shim.sh fletcher-c-abi variant=edge)
          SERVER=$(bash scripts/locate_shim.sh fletcher-c-abi-server variant=server)
          echo "path=$SHIM" >> "$GITHUB_OUTPUT"
          echo "server=$SERVER" >> "$GITHUB_OUTPUT"

      # Cleared BEFORE the suite runs, not after a failure. Leaked segments from
      # an earlier job on a reused runner fault `create_participant` with a false
      # `0xC0000005` for any QoS, which is indistinguishable from a real crash in
      # the binding - the repo's standing rule is to clear this directory before
      # believing any provider access violation, so this lane does it up front
      # rather than leaving the next reader to discover the rule.
      - name: Clear leaked Fast DDS shared-memory segments
        shell: bash
        run: rm -rf "/c/ProgramData/eprosima/fastdds_interprocess" || true

      - name: Run one body over every transport (edge build)
        shell: bash
        working-directory: integration-tests/pubsub-transport-conformance/dotnet/PubSubTransportConformance
        env:
          MICRO_XRCE_AGENT_PATH: C:/fl-uxa-install/bin/MicroXRCEAgent.exe
          MICRO_XRCE_AGENT_LIB_DIR: C:/fl-uxa-install/lib
        run: dotnet test -c Release -p:FletcherNativeShim="${{ steps.shim.outputs.path }}"

      # The server pass (D10C-7, M2; see the header): the same body, the server shim staged under
      # its own name in a fresh output folder that must hold it. Segments cleared again first.
      - name: Run one body over every transport (server build, under its own name)
        shell: bash
        working-directory: integration-tests/pubsub-transport-conformance/dotnet/PubSubTransportConformance
        env:
          MICRO_XRCE_AGENT_PATH: C:/fl-uxa-install/bin/MicroXRCEAgent.exe
          MICRO_XRCE_AGENT_LIB_DIR: C:/fl-uxa-install/lib
        run: |
          set -e
          rm -rf "/c/ProgramData/eprosima/fastdds_interprocess" || true
          OUT=$(mktemp -d)
          dotnet test -c Release -o "$(cygpath -m "$OUT")" -p:FletcherNativeShim="$(cygpath -m "${{ steps.shim.outputs.server }}")"
          if [ ! -f "$OUT/fletcher-c-abi-server.dll" ]; then
            echo "::error::the server pass output folder holds no server shim; the server pass did not test the server build"
            exit 1
          fi
