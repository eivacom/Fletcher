//
// The message the C# gateway client's live lane publishes and subscribes (BIND-8b).
//
// Chosen to reach what the gateway's old JSON create_topic path could not carry (D-BIND-112):
// a nested message, a Timestamp, a repeated field and a map, beside plain scalars.
syntax = "proto3";

package gateway.endtoend;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

message Position {
  double lat = 1;
  double lon = 2;
}

message Fix {
  int32 id = 1;
  string label = 2;
  Position at = 3;
  google.protobuf.Timestamp when = 4;
  repeated double readings = 5;
  map<string, int32> tags = 6;
}

service FixFeed {
  rpc Report(stream Fix) returns (google.protobuf.Empty);
}
