// BIND-7a: the fixture behind the committed C# accessor goldens csharp_accessor.fletcher.cs,
// csharp_accessor.fletcher.accessor.cs and csharp_accessor.fletcher.arrow.cs.
// test_csharp_visitor generates them from this file and fails if any differs from the
// committed copy by a byte; dotnet/tests/Fletcher.Tests compiles them and reads batches
// through them. Regenerate with FLETCHER_CAPTURE_GOLDENS=1 and review the diff as source.
syntax = "proto3";

package golden.accessor;

import "fletcher/options.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

enum Quality {
  QUALITY_UNSPECIFIED = 0;
  QUALITY_GOOD = 1;
  QUALITY_POOR = 2;
}

// A struct the samples below carry, plainly and optionally.
message Position {
  double lat = 1;
  double lon = 2;
  optional float depth = 3;
}

// Every scalar kind BIND-7a reads, each plain and optional, and the two struct shapes.
message Sample {
  int32 id = 1;
  int64 ticks = 2;
  uint32 flags = 3;
  uint64 serial = 4;
  float gain = 5;
  double value = 6;
  bool valid = 7;
  string name = 8;
  bytes payload = 9;
  Quality quality = 10;
  google.protobuf.Timestamp at = 11;
  google.protobuf.Duration span = 12;
  Position position = 13;

  optional int32 maybe_id = 21;
  optional string maybe_name = 22;
  optional bytes maybe_payload = 23;
  optional Quality maybe_quality = 24;
  optional bool maybe_valid = 25;
  optional Position maybe_position = 26;

  message Note {
    string text = 1;
  }
  Note note = 30;
}

// BIND-7b: every collection shape the accessor reads, as borrowed windows (D-BIND-101).
message Track {
  int32 id = 1;
  repeated int32 ints = 2;
  repeated string names = 3;
  repeated bytes blobs = 4;
  repeated bool flags = 5;
  repeated Quality qualities = 6;
  repeated double values = 7;
  repeated Position points = 8;
  map<string, int32> scores = 9;
  map<string, Position> places = 10;
  map<int64, string> labels = 11;
  // Lists of lists, as flatten wrappers nest them: depth 2 and 3 of structs, and a scalar leaf.
  repeated PositionList grid = 12;
  repeated PositionGrid cube = 13;
  repeated IntList matrix = 14;
  // Nullable in its column, not in the model (G-Q4): a null row reads as an empty window.
  optional PositionList maybe_points = 15;
}

message PositionList {
  option (fletcher.flatten) = true;
  repeated Position items = 1;
}

message PositionGrid {
  option (fletcher.flatten) = true;
  repeated PositionList rows = 1;
}

message PositionCube {
  option (fletcher.flatten) = true;
  repeated PositionGrid planes = 1;
}

message IntList {
  option (fletcher.flatten) = true;
  repeated int32 values = 1;
}

// A list nested 4 deep, beyond the cap of 3: the class exists and TryMake refuses (D-BIND-96).
message Hyper {
  int32 id = 1;
  repeated PositionCube cells = 2;
}
